<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis cuentas</title>
<meta name="theme-color" content="#040919">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen="loading">
<div class="app">
  <header class="top">
    <div class="hello">
      <div class="avatar">F</div>
      <div><small>Hola,</small><strong>Fermín</strong></div>
    </div>
    <div class="sync conn" id="sync"><i></i><span id="syncTxt">Conectando</span></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-in">
    <button class="tab on" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="tab" data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Movimientos</button>
    <button class="fab" id="fab" aria-label="Añadir movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Historial</button>
    <button class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Nuevo movimiento">
  <div class="sheet-head"><span style="width:34px"></span><div class="grab"></div>
    <button class="sheet-close" id="closeSheet" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="seg" id="seg"><button data-t="g" class="on">Gasto</button><button data-t="i">Ingreso</button></div>
  <div class="amount g zero num" id="amount"><span id="amtSign">−</span><span id="amtVal">0</span><span class="cur">€</span></div>
  <input class="note-in" id="note" placeholder="Añadir nota (opcional)" maxlength="60" autocomplete="off">
  <div class="cchips" id="cchips"></div>
  <div class="daterow" id="daterow">
    <button data-d="0">Hoy</button><button data-d="-1">Ayer</button>
    <label class="datepick" id="datepick"><input type="date" id="dateIn"><span id="dateLbl">Otra fecha</span></label>
  </div>
  <div class="keypad" id="keypad"></div>
  <div class="acts"><button class="del" id="delBtn" hidden>Eliminar</button><button class="save" id="saveBtn">Añadir gasto</button></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
